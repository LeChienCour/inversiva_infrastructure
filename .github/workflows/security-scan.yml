name: 🔒 Security Scan

on:
  push:
    branches: [main, develop, dev, feature/*]
    paths: ['modules/**', 'environments/**', '.checkov.yml']
  pull_request:
    branches: [main, develop, dev]
    paths: ['modules/**', 'environments/**', '.checkov.yml']
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum severity to fail on'
        required: false
        default: 'CRITICAL'
        type: choice
        options: [CRITICAL, HIGH, MEDIUM, LOW]

jobs:
  security-scan:
    name: 🔍 Scan Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Run Security Scan
        run: |
          echo "🔍 Running security scan..."
          pip install checkov
          
          # Create results directory
          mkdir -p security-results
          
          # Run Checkov scan
          checkov \
            --config-file .checkov.yml \
            --directory . \
            --output cli \
            --output sarif \
            --output json \
            --output-file-path security-results/ \
            --baseline .checkov.baseline \
            --soft-fail \
            2>&1 | tee security-results/scan-output.log
          
          # Parse results
          if [ -f "security-results/results_json.json" ]; then
            CRITICAL=$(jq '[.results.failed_checks[] | select(.severity == "CRITICAL")] | length' security-results/results_json.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.results.failed_checks[] | select(.severity == "HIGH")] | length' security-results/results_json.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.results.failed_checks[] | select(.severity == "MEDIUM")] | length' security-results/results_json.json 2>/dev/null || echo "0")
            
            echo "CRITICAL_COUNT=$CRITICAL" >> $GITHUB_ENV
            echo "HIGH_COUNT=$HIGH" >> $GITHUB_ENV
            echo "MEDIUM_COUNT=$MEDIUM" >> $GITHUB_ENV
            
            echo "📊 Security Scan Results:"
            echo "  Critical: $CRITICAL"
            echo "  High: $HIGH"
            echo "  Medium: $MEDIUM"
            
            # Fail based on severity threshold
            THRESHOLD="${{ github.event.inputs.severity || 'CRITICAL' }}"
            case $THRESHOLD in
              "CRITICAL")
                [ "$CRITICAL" -gt 0 ] && exit 1
                ;;
              "HIGH")
                [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ] && exit 1
                ;;
              "MEDIUM")
                [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ] || [ "$MEDIUM" -gt 0 ] && exit 1
                ;;
            esac
          fi
          
          echo "✅ Security scan passed!"

      - name: 📤 Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: security-results/results_sarif.sarif

      - name: 📦 Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-${{ github.sha }}
          path: security-results/
          retention-days: 30

      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const critical = process.env.CRITICAL_COUNT || '0';
            const high = process.env.HIGH_COUNT || '0';
            const medium = process.env.MEDIUM_COUNT || '0';
            
            const status = (critical === '0' && high === '0') ? '✅ PASSED' : '❌ ISSUES FOUND';
            
            const output = `## 🔒 Security Scan Results
            
            **Status**: ${status}
            
            ### Issue Breakdown
            - 🔴 Critical: ${critical}
            - 🟠 High: ${high}
            - 🟡 Medium: ${medium}
            
            ${status.includes('PASSED') ? 
              '✅ No critical security issues found!' : 
              '❌ Please review and fix security issues before merging.'
            }
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });