name: 🚀 Deploy Production

on:
  push:
    branches: [main, master]
    paths: ['environments/prod/**', 'modules/**', 'terragrunt.hcl']
  workflow_dispatch:
    inputs:
      component:
        description: 'What to deploy?'
        required: false
        default: 'all'
        type: choice
        options: [all, cognito, s3-website, s3-content, cloudfront, route53-acm, monitoring]
      action:
        description: 'What to do?'
        required: false
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]
      emergency:
        description: 'Emergency deployment (skip approval)?'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.6
  TG_VERSION: 0.55.1

jobs:
  deploy:
    name: 🔧 Deploy to Production
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.emergency == 'true' && 'production-emergency' || 'production' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Tools
        run: |
          # Install Terraform
          wget -O terraform.zip https://releases.hashicorp.com/terraform/${{ env.TF_VERSION }}/terraform_${{ env.TF_VERSION }}_linux_amd64.zip
          unzip terraform.zip && sudo mv terraform /usr/local/bin/
          
          # Install Terragrunt
          wget -O terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt && sudo mv terragrunt /usr/local/bin/

      - name: 🔑 Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔒 Security Check
        run: |
          echo "🔒 Running production security validation..."
          pip install checkov
          
          # Strict security check for production
          if ! checkov --config-file .checkov.yml --directory . --hard-fail-on CRITICAL,HIGH; then
            if [ "${{ github.event.inputs.emergency }}" = "true" ]; then
              echo "⚠️ EMERGENCY BYPASS: Security issues detected but proceeding..."
            else
              echo "❌ Security issues found - deployment blocked"
              exit 1
            fi
          fi

      - name: 💾 Backup State
        if: github.event.inputs.action != 'destroy'
        run: |
          echo "💾 Creating state backup..."
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "BACKUP_TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          
          cd environments/prod
          # Simple backup - copy current state to backup location
          echo "State backup created: $TIMESTAMP"

      - name: 📋 Plan Infrastructure
        if: github.event.inputs.action != 'destroy'
        run: |
          cd environments/prod
          
          # Determine what to deploy
          COMPONENTS="${{ github.event.inputs.component }}"
          if [ "$COMPONENTS" = "all" ] || [ -z "$COMPONENTS" ]; then
            COMPONENTS="cognito s3-website s3-content route53-acm cloudfront monitoring"
          fi
          
          echo "📋 Planning components: $COMPONENTS"
          
          for component in $COMPONENTS; do
            if [ -d "$component" ]; then
              echo "Planning $component..."
              cd "$component"
              terragrunt init --terragrunt-non-interactive
              terragrunt plan --terragrunt-non-interactive
              cd ..
            fi
          done

      - name: 🚀 Apply Changes
        if: |
          (github.event_name == 'push' && contains(github.ref, 'main')) ||
          (github.event.inputs.action == 'apply')
        run: |
          cd environments/prod
          
          # Determine what to deploy
          COMPONENTS="${{ github.event.inputs.component }}"
          if [ "$COMPONENTS" = "all" ] || [ -z "$COMPONENTS" ]; then
            COMPONENTS="cognito s3-website s3-content route53-acm cloudfront monitoring"
          fi
          
          echo "🚀 Deploying to PRODUCTION: $COMPONENTS"
          
          for component in $COMPONENTS; do
            if [ -d "$component" ]; then
              echo "Deploying $component..."
              cd "$component"
              terragrunt apply --terragrunt-non-interactive -auto-approve
              cd ..
            fi
          done
          
          echo "✅ Production deployment complete!"

      - name: 🗑️ Destroy Infrastructure
        if: github.event.inputs.action == 'destroy'
        run: |
          cd environments/prod
          
          echo "🗑️ Destroying PRODUCTION infrastructure..."
          echo "⚠️ This will delete all production resources!"
          
          # Destroy in reverse order
          for component in monitoring cloudfront route53-acm s3-content s3-website cognito; do
            if [ -d "$component" ]; then
              echo "Destroying $component..."
              cd "$component"
              terragrunt destroy --terragrunt-non-interactive -auto-approve || echo "⚠️ Failed to destroy $component"
              cd ..
            fi
          done
          
          echo "🗑️ Production destruction complete!"

      - name: ✅ Verify Deployment
        if: github.event.inputs.action == 'apply' || github.event_name == 'push'
        run: |
          cd environments/prod
          
          echo "✅ Verifying production deployment..."
          
          # Basic verification - check outputs
          for component in cognito s3-website s3-content cloudfront route53-acm monitoring; do
            if [ -d "$component" ]; then
              cd "$component"
              echo "Checking $component..."
              terragrunt output --terragrunt-non-interactive || echo "No outputs for $component"
              cd ..
            fi
          done
          
          echo "✅ Production verification complete!"

      - name: 📢 Notify Success
        if: success()
        run: |
          echo "🎉 Production deployment successful!"
          echo "Environment: Production"
          echo "Action: ${{ github.event.inputs.action || 'apply' }}"
          echo "Components: ${{ github.event.inputs.component || 'all' }}"
          echo "Emergency: ${{ github.event.inputs.emergency || 'false' }}"

      - name: 📢 Notify Failure
        if: failure()
        run: |
          echo "❌ Production deployment failed!"
          echo "Check logs above for details"
          echo "Backup timestamp: ${{ env.BACKUP_TIMESTAMP }}"