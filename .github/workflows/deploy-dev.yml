name: 🚀 Deploy Development

on:
  push:
    branches: [develop, dev, feature/*]
    paths: ['environments/dev/**', 'modules/**', 'terragrunt.hcl']
  pull_request:
    branches: [develop, dev]
    paths: ['environments/dev/**', 'modules/**', 'terragrunt.hcl']
  workflow_dispatch:
    inputs:
      component:
        description: 'What to deploy?'
        required: false
        default: 'all'
        type: choice
        options: [all, cognito, s3-website, s3-content, cloudfront, route53-acm, monitoring]
      action:
        description: 'What to do?'
        required: false
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.6
  TG_VERSION: 0.55.1

jobs:
  deploy:
    name: 🔧 Deploy to Dev
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Tools
        run: |
          # Install Terraform
          wget -O terraform.zip https://releases.hashicorp.com/terraform/${{ env.TF_VERSION }}/terraform_${{ env.TF_VERSION }}_linux_amd64.zip
          unzip terraform.zip && sudo mv terraform /usr/local/bin/
          
          # Install Terragrunt
          wget -O terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt && sudo mv terragrunt /usr/local/bin/

      - name: 🔑 Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Quick Security Check
        run: |
          echo "🔍 Running basic security validation..."
          pip install checkov
          checkov --config-file .checkov.yml --directory . --soft-fail --skip-check CKV_AWS_18,CKV_AWS_19 || echo "⚠️ Security warnings found but continuing..."

      - name: 📋 Plan Infrastructure
        if: github.event.inputs.action != 'destroy'
        run: |
          cd environments/dev
          
          # Determine what to deploy
          COMPONENTS="${{ github.event.inputs.component }}"
          if [ "$COMPONENTS" = "all" ] || [ -z "$COMPONENTS" ]; then
            COMPONENTS="cognito s3-website s3-content route53-acm cloudfront monitoring"
          fi
          
          echo "📋 Planning components: $COMPONENTS"
          
          for component in $COMPONENTS; do
            if [ -d "$component" ]; then
              echo "Planning $component..."
              cd "$component"
              terragrunt init --terragrunt-non-interactive
              terragrunt plan --terragrunt-non-interactive
              cd ..
            fi
          done

      - name: 🚀 Apply Changes
        if: |
          (github.event_name == 'push' && contains(github.ref, 'develop')) ||
          (github.event.inputs.action == 'apply')
        run: |
          cd environments/dev
          
          # Determine what to deploy
          COMPONENTS="${{ github.event.inputs.component }}"
          if [ "$COMPONENTS" = "all" ] || [ -z "$COMPONENTS" ]; then
            COMPONENTS="cognito s3-website s3-content route53-acm cloudfront monitoring"
          fi
          
          echo "🚀 Deploying components: $COMPONENTS"
          
          for component in $COMPONENTS; do
            if [ -d "$component" ]; then
              echo "Deploying $component..."
              cd "$component"
              terragrunt apply --terragrunt-non-interactive -auto-approve
              cd ..
            fi
          done
          
          echo "✅ Deployment complete!"

      - name: 🗑️ Destroy Infrastructure
        if: github.event.inputs.action == 'destroy'
        run: |
          cd environments/dev
          
          echo "🗑️ Destroying infrastructure..."
          
          # Destroy in reverse order
          for component in monitoring cloudfront route53-acm s3-content s3-website cognito; do
            if [ -d "$component" ]; then
              echo "Destroying $component..."
              cd "$component"
              terragrunt destroy --terragrunt-non-interactive -auto-approve || echo "⚠️ Failed to destroy $component"
              cd ..
            fi
          done
          
          echo "🗑️ Destruction complete!"

      - name: 📝 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `## 🚀 Dev Deployment Results
            
            **Status**: ${{ job.status }}
            **Components**: ${{ github.event.inputs.component || 'all' }}
            **Action**: ${{ github.event.inputs.action || 'plan' }}
            
            ${job.status === 'success' ? '✅ Ready to merge!' : '❌ Issues found - check logs'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });